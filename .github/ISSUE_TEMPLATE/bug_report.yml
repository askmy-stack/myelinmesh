name: Bug report
description: Report a reproducible defect
title: "bug: "
labels: [bug]
body:
  - type: textarea
    attributes:
      label: Description
      description: What happened and what did you expect?
    validations:
      required: true
  - type: input
    attributes:
      label: MyelinMesh version
    validations:
      required: true
  - type: textarea
    attributes:
      label: Reproduction
      description: Include a minimal redacted record and exact commands.
    validations:
      required: true
  - type: checkboxes
    attributes:
      label: Data safety
      options:
        - label: I removed secrets, personal data, protected health information, and proprietary artifacts.
          required: true
