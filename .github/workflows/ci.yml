name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Lint
        run: |
          ruff check .
          ruff format --check .
      - name: Type check
        run: mypy src
      - name: Test
        run: pytest --cov=myelinmesh --cov-report=xml
      - name: Verify generated schema
        run: |
          cp schemas/myelinmesh-evidence-record.v0.1.schema.json /tmp/schema-before.json
          python scripts/export_schema.py
          diff -u /tmp/schema-before.json schemas/myelinmesh-evidence-record.v0.1.schema.json
